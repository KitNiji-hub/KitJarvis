name: Secret protection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned and checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/secret-tools"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/secret-tools" gitleaks
          echo "$RUNNER_TEMP/secret-tools" >> "$GITHUB_PATH"
      - name: Scan complete history and checked-out files
        run: |
          python3 scripts/secret_guard.py history
          python3 scripts/secret_guard.py tracked
      - name: Verify guards with disposable synthetic credentials
        run: |
          python3 scripts/test_secret_guard.py
          python3 scripts/test_workflow_security.py
