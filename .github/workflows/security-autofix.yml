name: One-shot security autofix

on:
  push:
    branches:
      - kitniji/fast-pipeline
    paths:
      - .github/workflows/security-autofix.yml

permissions:
  contents: write

jobs:
  patch-memory-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          ref: kitniji/fast-pipeline
          fetch-depth: 0

      - name: Harden exception responses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/desktop_app/memory_viewer.py")
          source = path.read_text(encoding="utf-8")
          old = "str(e)"
          replacement = "type(e).__name__"
          count = source.count(old)

          if count == 0:
              raise SystemExit("Expected at least one str(e) exception exposure anchor")

          modified = source.replace(old, replacement)
          if old in modified:
              raise SystemExit("Not all exception exposure anchors were replaced")

          compile(modified, str(path), "exec")
          path.write_text(modified, encoding="utf-8")
          print(f"Replaced {count} exception-message exposures")
          PY

          python -m py_compile src/desktop_app/memory_viewer.py

      - name: Commit hardened memory viewer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/desktop_app/memory_viewer.py; then
            echo "No memory viewer changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/desktop_app/memory_viewer.py
          git commit -m "Harden memory viewer exception handling"
          git push origin HEAD:kitniji/fast-pipeline
